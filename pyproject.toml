[project]
name = "qdrant-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ujjwal Kumar", email = "ujjwal720946@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "q>=2.7",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
qdrant-rag-assistant = "qdrant_rag_assistant:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
